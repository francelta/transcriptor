<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Dark rounded background square -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>

  <!-- Sound Waves Left -->
  <rect x="24" y="52" width="6" height="24" rx="3" fill="#6366f1" opacity="0.75" />
  <rect x="34" y="40" width="6" height="48" rx="3" fill="#818cf8" />

  <!-- Central Microphone with Modern Gradient -->
  <g filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="52" y="30" width="24" height="42" rx="12" fill="url(#studioGrad)" />
    <!-- Mic Cap lines -->
    <line x1="56" y1="42" x2="72" y2="42" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="56" y1="50" x2="72" y2="50" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Mic Stand U-bracket -->
    <path d="M44 54 C 44 76, 84 76, 84 54" fill="none" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" />
    <!-- Mic Stand Stem -->
    <line x1="64" y1="76" x2="64" y2="92" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" />
    <!-- Base Plate -->
    <line x1="48" y1="92" x2="80" y2="92" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" />
  </g>

  <!-- Sound Waves Right -->
  <rect x="88" y="40" width="6" height="48" rx="3" fill="#818cf8" />
  <rect x="98" y="52" width="6" height="24" rx="3" fill="#06b6d4" opacity="0.75" />
</svg>
